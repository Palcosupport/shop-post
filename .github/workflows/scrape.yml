name: Actualizar precios

on:
  schedule:
    - cron: "30 4 * * *"   # todos los días a las 05:30/06:30 (hora de España)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r server/requirements.txt
      - name: Leer catálogos
        # Eroski bloquea los servidores de GitHub (HTTP 403): se actualiza desde el Mac (scripts/eroski-mac.sh).
        run: python server/run.py mercadona consum lidl
      - name: Publicar
        run: |
          git config user.name "shop-post-bot"
          git config user.email "shop-post-bot@users.noreply.github.com"
          git add docs/data server/history
          git diff --cached --quiet || git commit -m "Precios $(date -u +%F)"
          git push
